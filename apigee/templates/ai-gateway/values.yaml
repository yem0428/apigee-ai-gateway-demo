# ==============================================================================
# Apigee AI Gateway - Declarative Values Configuration
# ==============================================================================

gateway:
  name: "ai-gateway-v1"
  displayName: "Apigee Enterprise AI Gateway"
  description: "Enterprise AI Gateway with Smart Routing, Multi-Provider Support (Gemini & Claude on Vertex AI), Model Armor Security, and Token Governance"
  revision: 1
  project_id: "bap-apac-demo2"

# ------------------------------------------------------------------------------
# Feature Toggles
# ------------------------------------------------------------------------------
features:
  monetization:
    enabled: false
    default_currency: "USD"
    default_markup: 1.0
  model_armor:
    enabled: true
    location: "global"
    template: "ai-gateway-filter"
  llm_judge:
    enabled: false
    classifier_model: "gemini-3.1-flash-lite"
  quotas:
    enabled: true
  cors:
    enabled: true
  auth:
    enabled: true
    type: "apikey" # apikey | none
  identity_check:
    enabled: true
  semantic_cache:
    enabled: true

# ------------------------------------------------------------------------------
# Proxy Endpoints / Supported Protocols
# ------------------------------------------------------------------------------
endpoints:
  claude:
    enabled: true
    name: "claude-messages"
    base_path: "/v1/messages"
  gemini_native:
    enabled: true
    name: "gemini-native"
    base_path: "/ai/v1"
  openai_compat:
    enabled: true
    name: "openai-compat"
    base_path: "/v1/chat/completions"
  models_catalog:
    enabled: true
    name: "claude-models"
    base_path: "/v1/models"

# ------------------------------------------------------------------------------
# Global Defaults
# ------------------------------------------------------------------------------
defaults:
  model: "gemini-3.1-flash-lite"
  fallback: "gemini-3.1-flash-lite"
  target: "gemini"
  publisher: "google"
  format: "gemini"
  region: "global"

# ------------------------------------------------------------------------------
# Smart Routing Tiers & Task Mappings
# ------------------------------------------------------------------------------
routing:
  tiers:
    low: "gemini-3.1-flash-lite"
    medium: "gemini-3-flash"
    high: "gemini-3.1-pro-preview"
    max: "claude-3-5-sonnet"
  tasks:
    coding: "claude-3-5-sonnet"
    reasoning: "gemini-3.1-pro-preview"
    summarization: "gemini-3.1-flash-lite"
    simple_chat: "gemini-3-flash"
    classifier_model: "gemini-3.1-flash-lite"
  aliases:
    # Gemini Aliases
    "gemini-flash": "gemini-3-flash"
    "gemini-flash-lite": "gemini-3.1-flash-lite"
    "gemini-pro": "gemini-3.1-pro-preview"
    "gemini-3.1-pro": "gemini-3.1-pro-preview"
    # Claude Aliases on Vertex AI Model Garden
    "claude-3-5-sonnet": "claude-3-5-sonnet-v2@20241022"
    "claude-3-5-haiku": "claude-3-5-haiku@20241022"
    "claude-3-7-sonnet": "claude-3-7-sonnet@20250219"
    "claude-sonnet": "claude-3-5-sonnet-v2@20241022"
    "claude-haiku": "claude-3-5-haiku@20241022"
    # OpenAI & Auto Aliases
    "gpt-4o": "gemini-3.1-pro-preview"
    "gpt-4o-mini": "gemini-3.1-flash-lite"
    "auto": "gemini-3-flash"
    "gateway/auto": "gemini-3-flash"

# ------------------------------------------------------------------------------
